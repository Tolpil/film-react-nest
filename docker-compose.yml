services:
  database:
    image: postgres:14-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-exampledb}
      POSTGRES_USER: ${DATABASE_USERNAME:-exampleuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-examplepass}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/test/prac.init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/test/prac.films.sql:/docker-entrypoint-initdb.d/02-films.sql
      - ./backend/test/prac.shedules.sql:/docker-entrypoint-initdb.d/03-shedules.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-exampleuser} -d ${DATABASE_NAME:-exampledb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      tags:
        - "${REGISTRY:-ghcr.io}/${IMAGE_NAME:-film-react-nest}-backend:latest"
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-exampledb}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-exampleuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-examplepass}
      LOG_FORMAT: ${LOG_FORMAT:-dev}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      tags:
        - "${REGISTRY:-ghcr.io}/${IMAGE_NAME:-film-react-nest}-frontend:latest"
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "exit 0"]
    volumes:
      - frontend-dist:/dist

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      tags:
        - "${REGISTRY:-ghcr.io}/${IMAGE_NAME:-film-react-nest}-nginx:latest"
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  pgadmin-data:
  frontend-dist:

networks:
  app-network:
    driver: bridge